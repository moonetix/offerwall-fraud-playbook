name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
      - name: Node tests
        run: node --test
      - name: PHP tests
        run: php test/php/postback_test.php
